server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aplicacao de pagina unica: qualquer rota desconhecida devolve o index para
    # que o roteamento aconteca no cliente, em vez de virar 404 do servidor.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets levam hash no nome, entao podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index NAO pode ser cacheado: e ele que aponta para o hash novo apos um
    # deploy. Cachea-lo faria o navegador continuar pedindo assets que sumiram.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
