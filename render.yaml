# ---------------------------------------------------------------------------
# Blueprint do Render — alternativa sem custo ao Heroku.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: votacao-cooperativa-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # URL publica da API, definida no painel do Render.
    routes:
      # Aplicacao de pagina unica: toda rota cai no index.
      - type: rewrite
        source: /*
        destination: /index.html
